<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Scientific Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>

    <div class="toast" id="toast">Copied to clipboard!</div>

    <div class="app-container">
        <!-- Main Calculator Layout -->
        <main class="calculator">
            
            <div class="display">
                <div class="top-bar">
                    <span id="angleMode" class="badge">DEG</span>
                    <span id="memoryBadge" class="badge" style="visibility:hidden">M</span>
                </div>
                <div class="prev-expr" id="prevDisplay"></div>
                <div class="current-expr" id="currDisplay">0</div>
            </div>

            <div class="keypad">
                <!-- Top Casio Toggles -->
                <button class="btn memory" data-action="shift">SHIFT</button>
                <button class="btn memory" data-action="alpha">ALPHA</button>
                <button class="btn memory" data-action="calc">CALC</button>
                <button class="btn memory" data-action="eng">ENG</button>
                <button class="btn action" data-action="angle">DEG</button>

                <!-- Scientific Functions -->
                <button class="btn function" data-value="sin(">sin</button>
                <button class="btn function" data-value="cos(">cos</button>
                <button class="btn function" data-value="tan(">tan</button>
                <button class="btn function" data-value="log(">log</button>
                <button class="btn function" data-value="ln(">ln</button>

                <!-- More Functions -->
                <button class="btn function" data-value="sqrt(">√</button>
                <button class="btn function" data-value="cbrt(">∛</button>
                <button class="btn function" data-value="^">xʸ</button>
                <button class="btn function" data-value="e^">eˣ</button>
                <button class="btn function" data-value="!">x!</button>

                <!-- Symbols -->
                <button class="btn symbol" data-value="(">(</button>
                <button class="btn symbol" data-value=")">)</button>
                <button class="btn symbol" data-value="|">|x|</button>
                <button class="btn constant" data-value="π">π</button>
                <button class="btn constant" data-value="e">e</button>

                <!-- Num Pad & Operators Row 1 -->
                <button class="btn number" data-value="7">7</button>
                <button class="btn number" data-value="8">8</button>
                <button class="btn number" data-value="9">9</button>
                <button class="btn action clear" data-action="delete">DEL</button>
                <button class="btn action clear" data-action="clearAll">AC</button>

                <!-- Num Pad & Operators Row 2 -->
                <button class="btn number" data-value="4">4</button>
                <button class="btn number" data-value="5">5</button>
                <button class="btn number" data-value="6">6</button>
                <button class="btn op" data-value="*">×</button>
                <button class="btn op" data-value="/">÷</button>

                <!-- Num Pad & Operators Row 3 -->
                <button class="btn number" data-value="1">1</button>
                <button class="btn number" data-value="2">2</button>
                <button class="btn number" data-value="3">3</button>
                <button class="btn op" data-value="+">+</button>
                <button class="btn op" data-value="-">−</button>

                <!-- Num Pad & Operators Row 4 -->
                <button class="btn action" data-value="%">%</button>
                <button class="btn number" data-value="0">0</button>
                <button class="btn number" data-value=".">.</button>
                <button class="btn execute" data-action="calculate" style="grid-column: span 2">=</button>
            </div>
        </main>

        <!-- History Panel -->
        <aside class="history-panel">
            <header>
                <h2><i class="fas fa-history"></i> History</h2>
                <button id="clearHistory" title="Clear History"><i class="fas fa-trash-alt"></i></button>
            </header>
            <div class="history-list" id="historyList">
                <!-- Populated dynamically -->
            </div>
        </aside>

    </div>
    <script src="script.js"></script>
</body>
</html>
